# FREE setup for team testing: Render free web service + free Neon Postgres, photos stored in the DB.
# Limits: the server sleeps after ~15 min idle (first visit then waits 30-60s). Before the real pilot,
# switch to render.paid.yaml (always-on). Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: shalosh-pilot
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE
        value: db              # no persistent disk on the free plan
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false            # paste the Neon connection string (postgresql://...?sslmode=require)
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BASE_URL
        sync: false            # e.g. https://shalosh-pilot.onrender.com
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
