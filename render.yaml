# Render Blueprint: one web service (Docker) + managed Postgres + a persistent disk for photos.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then fill the `sync: false` values.
services:
  - type: web
    name: shalosh-pilot
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    region: frankfurt
    healthCheckPath: /healthz
    disk:
      name: shalosh-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shalosh-db
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BASE_URL
        sync: false          # e.g. https://shalosh-pilot.onrender.com or your own domain
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5

databases:
  - name: shalosh-db
    plan: basic-256mb
    region: frankfurt
    databaseName: shalosh
    ipAllowList: []          # only reachable from Render services
