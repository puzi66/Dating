<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="referrer" content="no-referrer">
<title>{% block title %}ניהול{% endblock %} · שלוש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="admin">
  <nav class="admin-nav">
    {% include "_brand.html" %}
    {% set here = request.url.path %}
    <a href="/admin" class="{{ 'on' if here in ('/admin', '/admin/') or here.startswith('/admin/participants') }}">משתתפים</a>
    <a href="/admin/drops" class="{{ 'on' if here.startswith('/admin/drops') }}">Drop</a>
    <a href="/admin/responses" class="{{ 'on' if here.startswith('/admin/responses') }}">תשובות והתאמות</a>
    <a href="/admin/metrics" class="{{ 'on' if here.startswith('/admin/metrics') }}">מדדים</a>
  </nav>
  {% if msg %}<div class="ok">{{ msg }}</div>{% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% block body %}{% endblock %}
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
