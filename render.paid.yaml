# PAID setup (~$14/month): always-on server + Render Postgres + persistent disk for photos.
# To use it: rename this file to render.yaml (replacing the free one) and redeploy the Blueprint.
services:
  - type: web
    name: shalosh-pilot
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    region: frankfurt
    healthCheckPath: /healthz
    disk:
      name: shalosh-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE
        value: local
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shalosh-db
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BASE_URL
        sync: false          # e.g. https://shalosh-pilot.onrender.com or your own domain
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5

databases:
  - name: shalosh-db
    plan: basic-256mb
    region: frankfurt
    databaseName: shalosh
    ipAllowList: []          # only reachable from Render services
